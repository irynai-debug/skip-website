name: Deploy SKIP to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize published Sanity content
        env:
          SANITY_PROJECT_ID: 3g1ua4nm
          SANITY_DATASET: production
          SANITY_API_VERSION: 2025-02-19
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: pnpm run content:sync -- --strict

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /skip-website
          NEXT_PUBLIC_ASSET_PREFIX: /skip-website
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
